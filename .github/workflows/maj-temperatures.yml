name: maj-temperatures

on:
  schedule:
    - cron: '*/15 * * * *'   # secours (GitHub sature souvent cet intervalle) ; le vrai timing vient du déclencheur externe
  workflow_dispatch:          # déclenché de façon fiable par cron-job.org (et bouton "Run workflow" à la main)

permissions:
  contents: write             # nécessaire pour committer le CSV

concurrency:
  group: maj-temperatures
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Générer temperatures.csv
        run: python fetch_temperatures.py

      - name: Publier si la donnée a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temperatures.csv
          git diff --staged --quiet || (git commit -m "maj températures" && git push)
